plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude development-only files from the finished jar
    exclude("**/*.bbmodel")                // Blockbench project files
    exclude("src/generated/**/.cache")     // datagen cache files
}

// ---------------------------------------------------------------------------
// Repositories: where Gradle downloads libraries from
// ---------------------------------------------------------------------------
repositories {
    mavenCentral()

    // PlayerAnimationLibrary (player animations)
    maven {
        name = 'Redlance'
        url = 'https://repo.redlance.org/public'
    }

    // GeckoLib (animated mobs and entities)
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter {
            includeGroupAndSubgroups('software.bernie')
        }
    }
}

// ---------------------------------------------------------------------------
// NeoForge setup and run configurations
// ---------------------------------------------------------------------------
neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // A second player for testing multiplayer. Run it next to "client".
        client2 {
            client()
            gameDirectory = file('run-client2')
            programArguments.addAll '--username', 'Dev2'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Generates data files (recipes, loot tables, worldgen) into src/generated/resources
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // Applies to all run configurations above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 'localRuntime' = present when testing in your dev environment, but not
// passed on to anyone who depends on this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// ---------------------------------------------------------------------------
// Dependencies: versions are set in gradle.properties
// ---------------------------------------------------------------------------
dependencies {
    // PlayerAnimationLibrary (NeoForge build)
    implementation "com.zigythebird.playeranim:PlayerAnimationLibNeo:${pal_version}"

    // GeckoLib 4 (NeoForge build for your Minecraft version)
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
}

// ---------------------------------------------------------------------------
// Mod metadata: fills ${...} placeholders in src/main/templates
// ---------------------------------------------------------------------------
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the generated metadata in the build, and regenerate on every project reload
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// IntelliJ no longer downloads sources and javadoc automatically
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}